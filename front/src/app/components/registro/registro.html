<div class="register-container">
  <h2>Registro de Ciudadano</h2>
  <form (ngSubmit)="registrar()">
    <label>Nombre Completo:</label>
    <input type="text" [(ngModel)]="ciudadano.nombreCompleto" name="nombreCompleto" required />

    <label>Cédula de Identidad:</label>
    <input type="text" [(ngModel)]="ciudadano.ci" name="ci" required />

    <label>Credencial Cívica:</label>
    <input type="text" [(ngModel)]="ciudadano.cc" name="cc" required />

    <label>Fecha de Nacimiento:</label>
    <input type="date" [(ngModel)]="ciudadano.fechaNacimiento" name="fechaNacimiento" required />

    <button type="submit">Registrarse</button>
  </form>

  <p class="mt-4">
    ¿Ya estás registrado? <a [routerLink]="['']">Iniciar sesión</a>
  </p>
</div>
